# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret.
#
# On npmjs.com → package → Access → Trusted Publishers → GitHub Actions:
#   org/user: jrs-t2g
#   repository: payload-plugin-google-drive
#   workflow: publish.yml
#   environment: npm-publish
#
# Releases are driven by semantic-release on pushes to `master` (see .releaserc.json).

name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: pnpm lint:types && pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        # Do not set registry-url here: setup-node would write an .npmrc that
        # references NODE_AUTH_TOKEN and can block OIDC Trusted Publishing.
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm CLI version
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const v = execSync('npm --version', { encoding: 'utf8' }).trim().split('.').map(Number);
            const min = [11, 5, 1];
            const ok =
              v[0] > min[0] ||
              (v[0] === min[0] && (v[1] > min[1] || (v[1] === min[1] && v[2] >= min[2])));
            if (!ok) process.exit(1);
            console.log('npm', v.join('.'), 'OK for Trusted Publishing');
          "

      - name: Remove stray .npmrc (OIDC)
        run: rm -f .npmrc ~/.npmrc

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
